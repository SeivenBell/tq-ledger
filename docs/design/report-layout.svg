<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
  <title id="title">QRef report: proposed first viewport</title>
  <desc id="desc">Planning schematic, not implemented software. A finding-first report shows equivalent circuits, a changed shot setting, an unrecorded human decision and limits. The comparison table is followed by evidence links and detailed sections.</desc>
  <style>
    text{font-family:system-ui,-apple-system,sans-serif;fill:var(--fg,currentColor)}
    .muted{fill:var(--muted,currentColor)}
    .rule{stroke:var(--border,currentColor);stroke-width:1;fill:none}
    .attention{fill:var(--warning,currentColor)}
    .positive{fill:var(--success,currentColor)}
    .small{font-size:14px}.body{font-size:16px}.label{font-size:15px;font-weight:600}
  </style>
  <text x="32" y="26" class="small muted">DESIGN SCHEMATIC — not an implemented interface</text>
  <rect x="30" y="46" width="940" height="712" rx="4" class="rule"/>
  <text x="58" y="86" font-size="21" font-weight="650">QRef</text>
  <text x="127" y="86" class="small muted">/ Migration report</text>
  <rect x="675" y="63" width="116" height="38" rx="3" class="rule"/>
  <text x="692" y="87" class="small">Save HTML</text>
  <rect x="804" y="63" width="137" height="38" rx="3" class="rule"/>
  <text x="820" y="87" class="small">Evidence JSON</text>
  <line x1="58" y1="119" x2="942" y2="119" class="rule"/>
  <text x="58" y="151" class="small muted">Recorded local execution · QAOA helpers · Qiskit 0.46.3 to 2.6.1</text>
  <text x="58" y="168" class="small muted">Run identity: not recorded · execution time: not recorded — planning view</text>
  <text x="58" y="204" font-size="31" font-weight="650">Equivalent circuits.</text>
  <text x="58" y="245" font-size="31" font-weight="650">A changed shot setting.</text>
  <text x="58" y="283" class="body">The target honors the caller's request. The reference did not.</text>
  <text x="58" y="309" class="body muted">This changes sampling uncertainty, even when circuit checks agree.</text>
  <rect x="58" y="337" width="884" height="139" class="rule"/>
  <line x1="58" y1="381" x2="942" y2="381" class="rule"/>
  <line x1="58" y1="428" x2="942" y2="428" class="rule"/>
  <line x1="337" y1="337" x2="337" y2="476" class="rule"/>
  <line x1="651" y1="337" x2="651" y2="476" class="rule"/>
  <text x="78" y="365" class="label">Requested shots</text>
  <text x="357" y="365" class="label">Reference completed</text>
  <text x="672" y="365" class="label">Target completed</text>
  <text x="78" y="412" font-size="22">512</text>
  <text x="357" y="412" font-size="22" class="attention">1,024</text>
  <text x="672" y="412" font-size="22">512</text>
  <text x="78" y="459" font-size="22">17</text>
  <text x="357" y="459" font-size="22" class="attention">1,024</text>
  <text x="672" y="459" font-size="22">17</text>
  <text x="58" y="508" class="small muted">18 executions per runtime. The prompt requested the correction; the model documented it.</text>
  <text x="58" y="546" class="label positive">Circuits: equivalent on declared cases</text>
  <text x="521" y="546" class="label attention">Human decision: not recorded</text>
  <text x="58" y="577" class="body">Coverage: 3 graphs, 3 angle settings, 2 requested shot counts.</text>
  <text x="58" y="604" class="body muted">Not checked: optimizer convergence, hardware, noise and dynamic circuits.</text>
  <line x1="58" y1="630" x2="942" y2="630" class="rule"/>
  <text x="58" y="665" class="label">Findings</text>
  <text x="184" y="665" class="label">Checks</text>
  <text x="296" y="665" class="label">Limits</text>
  <text x="400" y="665" class="label">Source changes</text>
  <text x="586" y="665" class="label">Reproduce</text>
  <line x1="58" y1="686" x2="942" y2="686" class="rule"/>
  <text x="58" y="719" class="small muted">Each finding links to exact observations, the source hunk and the recorded review.</text>
  <text x="58" y="743" class="small muted">No live job, confidence score, certification seal or fake approval control.</text>
  <text x="32" y="782" class="small muted">Mobile: preserve this reading order; keep labels on values; scroll only dense evidence/code regions.</text>
</svg>
