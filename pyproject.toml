[project]
name = "qref"
version = "0.1.0"
description = "Reviewable evidence for AI-assisted Qiskit migrations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = ["jinja2==3.1.6", "jsonschema==4.25.1"]

[project.scripts]
qref = "qref.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
