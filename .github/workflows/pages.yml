name: Publish verified QRef report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install base QRef (no quantum libraries, no model access)
        run: uv sync --frozen --no-dev
      - name: Verify curated exports byte-for-byte against their manifests
        run: |
          uv run qref verify-bundle --run examples/qaoa-run
          uv run qref verify-bundle --run examples/research-port
      - name: Assemble site from verified bytes only
        run: |
          mkdir site
          cp -R examples/qaoa-run/. site/
          cp -R examples/research-port site/research-port
          cp -R examples/qaoa-proposal site/proposal
          uv run qref verify-bundle --run site/research-port
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
